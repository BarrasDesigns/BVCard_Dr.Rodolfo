<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Rodolfo Carranza | BVCard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome (Redes Sociales) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind CSS (CDN para desarrollo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        ubuntu: ['Ubuntu', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            primary: '#2B4C7E', // Color institucional médico/holístico
                            secondary: '#567EBB',
                            accent: '#D4AF37' // Dorado para toque de autoridad/holístico
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 font-ubuntu antialiased min-h-screen flex justify-center pb-10">

    <!-- Contenedor Principal Tap-It (Max 430px simula pantalla móvil) -->
    <main class="w-full max-w-[430px] bg-white min-h-screen shadow-2xl relative overflow-hidden">

        <!-- Cabecera / Cover Photo -->
        <header
            class="h-40 bg-gradient-to-r from-brand-primary to-brand-secondary relative rounded-b-[2.5rem] shadow-md">
            <!-- Reproductor de Audio Oculto / Botón Flotante -->
           <!-- <button id="btnAudio"
                class="absolute top-4 right-4 bg-white/20 backdrop-blur-sm p-3 rounded-full text-white hover:bg-white/40 transition">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <audio id="audioElement" src="./audio/kikeMillan3_final.mp3" preload="none"></audio>-->
        </header>

        <!-- Sección de Perfil y Marco Fotográfico -->
        <section class="flex flex-col items-center -mt-20 px-6">
            <!-- Marco Fotográfico Animado -->
            <div
                class="relative w-36 h-36 rounded-full p-1 bg-gradient-to-tr from-brand-accent via-yellow-200 to-brand-primary shadow-xl pulse-border">
                <div class="w-full h-full rounded-full border-4 border-white overflow-hidden bg-white">
                    <!-- Placeholder para la foto del doctor -->
                    <img src="./foto1.png" alt="Dr. Rogelio Carranza" class="w-full h-full object-cover"
                        onerror="this.src='https://ui-avatars.com/api/?name=Kike+Millan&background=2B4C7E&color=fff&size=150'">
                </div>
            </div>

            <div class="text-center mt-4 mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Dr. Rogelio Carranza</h1>
                <p class="text-sm font-medium text-brand-primary uppercase tracking-wide mt-1">El Encantador de Mentes
                </p>
                <p class="text-gray-500 text-sm mt-2">Asesor Medico de Siniestros Gastos Medicos Terapia Celular Nanotecnologia</p>
            </div>

            <!-- Botones Core (Acciones Tap-It) -->
            <div class="w-full flex gap-3 mb-8">
                <button id="btnSaveContact"
                    class="flex-1 bg-brand-primary text-white py-3 rounded-xl font-semibold shadow-lg shadow-brand-primary/30 hover:bg-brand-secondary transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Guardar
                </button>
                <button id="btnShare"
                    class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-200 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i> Compartir
                </button>
            </div>
        </section>

        <!-- Cuadrícula de Redes Sociales -->
        <section class="px-6 mb-8">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 text-center">Conecta Conmigo</h2>
            <div class="grid grid-cols-4 gap-4">
                <a href="https://wa.me/+528111576796"
                    class="social-btn bg-green-50 text-green-600 hover:bg-green-500 hover:text-white">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-pink-50 text-pink-600 hover:bg-pink-500 hover:text-white">
                    <i class="fa-brands fa-instagram text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white">
                    <i class="fa-brands fa-facebook-f text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-black/5 text-gray-800 hover:bg-black hover:text-white">
                    <i class="fa-brands fa-tiktok text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-red-50 text-red-600 hover:bg-red-500 hover:text-white">
                    <i class="fa-brands fa-youtube text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-brand-primary/10 text-brand-primary hover:bg-brand-primary hover:text-white">
                    <i class="fa-solid fa-calendar-check text-2xl"></i>
                </a>
            </div>
        </section>

        <!-- Enlaces de Servicios y Productos -->
        <section class="px-6 mb-10 space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Servicios</h2>

            <a href="#" class="link-card group">
                <div
                    class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary group-hover:bg-brand-primary group-hover:text-white transition">
                    <i class="fa-solid fa-brain"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3">Servicio 1</span>
                <i class="fa-solid fa-chevron-right ml-auto text-gray-300"></i>
            </a>

            <a href="#" class="link-card group">
                <div
                    class="bg-brand-accent/20 p-3 rounded-lg text-brand-accent group-hover:bg-brand-accent group-hover:text-white transition">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3">MServicio 2</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>

            <a href="#" class="link-card group">
                <div
                    class="bg-brand-secondary/10 p-3 rounded-lg text-brand-secondary group-hover:bg-brand-secondary group-hover:text-white transition">
                    <i class="fa-solid fa-chalkboard-user"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3">Servicio 3</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>
        </section>

        <!-- Footer / Créditos -->
        <!--<footer class="bg-gray-50 py-6 text-center border-t border-gray-100 mt-auto">
            <a href="https://www.barras-designs.com.mx/" target="_blank"
                class="flex flex-col items-center justify-center opacity-70 hover:opacity-100 transition">
                <img src="./img/bdLogo.png" alt="Barras Designs Logo" class="h-6 mb-2 grayscale"
                    onerror="this.style.display='none'">
                <p class="text-[10px] text-gray-500 font-medium">Software & Soluciones Digitales por <br><strong
                        class="text-gray-700">Barras Designs</strong> &copy; 2026</p>
            </a>
        </footer>-->
    </main>

    <script src="js/main.js"></script>
</body>

</html>
