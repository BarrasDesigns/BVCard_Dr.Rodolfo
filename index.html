<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Rogelio Carranza | BVCard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome (Redes Sociales) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        ubuntu: ['Ubuntu', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            primary: '#231a9a',   // Azul Principal
                            secondary: '#312975', // Azul Oscuro
                            accent: '#ffffff'     // Blanco
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 font-ubuntu antialiased min-h-screen flex justify-center pb-10">

    <!-- Contenedor Principal Tap-It (Max 430px simula pantalla móvil) -->
    <main class="w-full max-w-[430px] bg-white min-h-screen shadow-2xl relative overflow-hidden">

        <!-- Cabecera / Cover Photo con Logo -->
        <header class="h-44 bg-gradient-to-r from-brand-primary to-brand-secondary relative rounded-b-[2.5rem] shadow-md flex items-center justify-center pb-8 pt-4 px-4">
            <!-- Logo de Medicina Biológica y Regenerativa -->
            <img src="./logo.png" alt="Medicina Biológica y Regenerativa Logo" class="h-20 max-w-[80%] object-contain drop-shadow-md"
                 onerror="this.style.display='none'">
        </header>

        <!-- Sección de Perfil y Marco Fotográfico -->
        <section class="flex flex-col items-center -mt-16 px-6">
            <!-- Marco Fotográfico Animado -->
            <div class="relative w-36 h-36 rounded-full p-1 bg-gradient-to-tr from-brand-primary via-brand-secondary to-indigo-500 shadow-xl pulse-border">
                <div class="w-full h-full rounded-full border-4 border-white overflow-hidden bg-white">
                    <!-- Foto del Doctor -->
                    <img src="./foto1.png" alt="Dr. Rogelio Carranza" class="w-full h-full object-cover"
                        onerror="this.src='https://ui-avatars.com/api/?name=Rogelio+Carranza&background=231a9a&color=fff&size=150'">
                </div>
            </div>

            <div class="text-center mt-4 mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Dr. Rogelio Carranza</h1>
                <p class="text-sm font-semibold text-brand-primary uppercase tracking-wide mt-1">
                    Medicina Biológica Regenerativa
                </p>
                <p class="text-gray-500 text-xs font-medium mt-2 tracking-wider">REGENERAR <span>•</span> RESTAURAR <span>•</span> OPTIMIZAR</p>
            </div>

            <!-- Botones Core (Acciones Tap-It) -->
            <div class="w-full flex gap-3 mb-8">
                <button id="btnSaveContact"
                    class="flex-1 bg-brand-primary text-white py-3 rounded-xl font-semibold shadow-lg shadow-brand-primary/30 hover:bg-brand-secondary transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Guardar
                </button>
                <button id="btnShare"
                    class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold shadow-sm hover:bg-gray-200 transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-share-nodes"></i> Compartir
                </button>
            </div>
        </section>

        <!-- Cuadrícula de Redes Sociales -->
        <section class="px-6 mb-8">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 text-center">Conecta Conmigo</h2>
            <div class="grid grid-cols-4 gap-4">
                <a href="https://wa.me/+528111576796"
                    class="social-btn bg-green-50 text-green-600 hover:bg-green-500 hover:text-white">
                    <i class="fa-brands fa-whatsapp text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-pink-50 text-pink-600 hover:bg-pink-500 hover:text-white">
                    <i class="fa-brands fa-instagram text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white">
                    <i class="fa-brands fa-facebook-f text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-black/5 text-gray-800 hover:bg-black hover:text-white">
                    <i class="fa-brands fa-tiktok text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-red-50 text-red-600 hover:bg-red-500 hover:text-white">
                    <i class="fa-brands fa-youtube text-2xl"></i>
                </a>
                <a href="#"
                    class="social-btn bg-brand-primary/10 text-brand-primary hover:bg-brand-primary hover:text-white">
                    <i class="fa-solid fa-calendar-check text-2xl"></i>
                </a>
            </div>
        </section>

        <!-- Enlaces de Servicios y Productos -->
        <section class="px-6 mb-10 space-y-3">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Servicios</h2>

            <!-- Ubicación -->
            <a href="https://maps.app.goo.gl/aGuRnTpVSEsGXrcTA" target="_blank" rel="noopener noreferrer" class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-red-100 p-3 rounded-lg text-red-600 group-hover:bg-red-500 group-hover:text-white transition">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Ubicación del Consultorio</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>

            <!-- Servicio 1 -->
            <a href="#" class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary group-hover:bg-brand-primary group-hover:text-white transition">
                    <i class="fa-solid fa-dna"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Terapia Celular y Regenerativa</span>
                <i class="fa-solid fa-chevron-right ml-auto text-gray-300 text-sm"></i>
            </a>

            <!-- Servicio 2 -->
            <a href="#" class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-secondary/10 p-3 rounded-lg text-brand-secondary group-hover:bg-brand-secondary group-hover:text-white transition">
                    <i class="fa-solid fa-flask"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Nanotecnología Médica</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>

            <!-- Servicio 3 -->
            <a href="#" class="link-card group flex items-center p-3 bg-gray-50 rounded-xl hover:bg-gray-100 transition border border-gray-100">
                <div class="bg-brand-primary/10 p-3 rounded-lg text-brand-primary group-hover:bg-brand-primary group-hover:text-white transition">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <span class="font-medium text-gray-700 ml-3 text-sm">Asesoría Médica Especializada</span>
                <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-gray-300 text-sm"></i>
            </a>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
